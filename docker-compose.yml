services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mediagrid
      POSTGRES_USER: mediagrid
      POSTGRES_PASSWORD: mediagrid
    ports:
      - "5432:5432"
    volumes:
      - mediagrid-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediagrid"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mediagrid-postgres:

