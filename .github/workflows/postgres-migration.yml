name: PostgreSQL migration smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/api/**"
      - "migrations/**"
      - "workers/render/**"
      - "scripts/smoke_postgres_migrations.py"
      - "scripts/verify_postgres_restore.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/postgres-migration.yml"

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: mediagrid_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mediagrid_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Migrate preserved data and claim a job
        env:
          DATABASE_URL: postgresql+psycopg://postgres:ci-only@127.0.0.1:5432/mediagrid_ci
          MEDIAGRID_ALLOW_EPHEMERAL_PG_SMOKE: "1"
          MEDIAGRID_DATA_DIR: ./data/postgres-ci
        run: uv run python -m scripts.smoke_postgres_migrations
      - name: Dump and restore to a second disposable database
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER" pg_dump -U postgres -Fc -d mediagrid_ci > /tmp/mediagrid-ci.dump
          test -s /tmp/mediagrid-ci.dump
          docker exec "$PG_CONTAINER" createdb -U postgres mediagrid_restored
          docker exec -i "$PG_CONTAINER" pg_restore -U postgres -d mediagrid_restored --no-owner --exit-on-error < /tmp/mediagrid-ci.dump
          sha256sum /tmp/mediagrid-ci.dump
      - name: Verify restored database
        env:
          DATABASE_URL: postgresql+psycopg://postgres:ci-only@127.0.0.1:5432/mediagrid_restored
          MEDIAGRID_ALLOW_EPHEMERAL_PG_SMOKE: "1"
        run: uv run python -m scripts.verify_postgres_restore
