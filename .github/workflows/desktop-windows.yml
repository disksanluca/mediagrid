name: Windows desktop build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - "apps/api/**"
      - "workers/**"
      - "scripts/desktop_service.py"
      - "scripts/build-desktop-sidecar.ps1"
      - "scripts/speak.ps1"
      - "scripts/transcribe.ps1"
      - "scripts/build-desktop-runtime.ps1"
      - "scripts/smoke-desktop-windows.ps1"
      - "apps/desktop/runtime/**"
      - "scripts/build-desktop-web.mjs"
      - "package*.json"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/desktop-windows.yml"

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Test local Python services
        shell: pwsh
        run: |
          & cmd /c "uv run pytest -q --maxfail=1 > python-test.log 2>&1"
          $testExitCode = $LASTEXITCODE
          Get-Content python-test.log -Tail 100
          if ($testExitCode -ne 0) {
            $summary = (Get-Content python-test.log -Tail 35) -join ' | '
            Write-Output "::error title=Python tests failed::$summary"
            exit $testExitCode
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mediagrid-python-test-log
          path: python-test.log
          if-no-files-found: ignore
      - name: Build local Python service
        shell: pwsh
        run: .\scripts\build-desktop-sidecar.ps1
      - name: Bundle local renderer runtime
        shell: pwsh
        run: .\scripts\build-desktop-runtime.ps1
      - name: Build Windows application
        shell: pwsh
        run: |
          & cmd /c "npm run build --workspace @mediagrid/desktop > desktop-build.log 2>&1"
          $buildExitCode = $LASTEXITCODE
          Get-Content desktop-build.log -Tail 100
          if ($buildExitCode -ne 0) {
            $summary = (Get-Content desktop-build.log -Tail 25) -join ' | '
            Write-Output "::error title=Desktop build failed::$summary"
            exit $buildExitCode
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mediagrid-desktop-build-log
          path: desktop-build.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: mediagrid-desktop-windows-test-build
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Smoke test installed Windows app
        shell: pwsh
        run: |
          & cmd /c "pwsh -NoProfile -File .\scripts\smoke-desktop-windows.ps1 > desktop-smoke.log 2>&1"
          $smokeExitCode = $LASTEXITCODE
          Get-Content desktop-smoke.log -Tail 100
          if ($smokeExitCode -ne 0) {
            $summary = (Get-Content desktop-smoke.log -Tail 35) -join ' | '
            Write-Output "::error title=Installed app smoke test failed::$summary"
            exit $smokeExitCode
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mediagrid-desktop-smoke-log
          path: desktop-smoke.log
          if-no-files-found: ignore
