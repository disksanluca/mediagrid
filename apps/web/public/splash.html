<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediaGrid</title>
  <style>
    @font-face{font-family:"Space Grotesk";src:url("/fonts/spacegrotesk-SpaceGrotesk-wght.ttf") format("truetype");font-weight:300 700;font-display:swap}
    @font-face{font-family:"IBM Plex Mono";src:url("/fonts/ibmplexmono-IBMPlexMono-Regular.ttf") format("truetype");font-weight:400;font-display:swap}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0e0c;color:#f1f3ed;font-family:"Space Grotesk",Segoe UI,Arial,sans-serif}
    main{text-align:center}
    img{width:86px;height:86px;margin-bottom:20px}
    h1{font-size:30px;letter-spacing:-.06em;margin:0 0 8px}
    p{color:#a0a8a0;font-family:"IBM Plex Mono",Consolas,monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
    .line{height:2px;width:180px;margin:28px auto 0;background:linear-gradient(90deg,#2a302b,#d0e5bc,#2a302b);animation:pulse 1.5s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.25}}
  </style>
</head>
<body><main><img src="/brand-mark.svg" alt=""><h1>MediaGrid</h1><p>Iniciando estúdio local...</p><div class="line"></div></main></body>
</html>
