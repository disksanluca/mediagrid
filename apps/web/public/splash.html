<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediaGrid</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1015;color:#f6f7f9;font-family:Segoe UI,Arial,sans-serif}
    main{text-align:center}
    img{width:86px;height:86px;margin-bottom:20px}
    h1{font-size:30px;letter-spacing:.04em;margin:0 0 8px}
    p{color:#aab8c9;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
    .line{height:2px;width:180px;margin:28px auto 0;background:linear-gradient(90deg,#252e38,#e2e7ee,#252e38);animation:pulse 1.5s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.25}}
  </style>
</head>
<body><main><img src="/brand-mark.svg" alt=""><h1>MEDIAGRID</h1><p>Starting Content Operating System...</p><div class="line"></div></main></body>
</html>
